<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 project</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
        </dl>
        <p id="goal">
          You are an adventurer. Delve the dungeon, craft a magic catalyst to
          reach its core, and forge the Heart of the Dungeon from its shards.
        </p>

        <h3>Inventory</h3>
        <ul id="inventory" aria-label="Inventory"></ul>

        <h3>Recipes</h3>
        <ul id="recipes" aria-label="Recipes"></ul>

        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>
      <section id="banner" hidden>
        <h1>Heart of the Dungeon</h1>
        <p>The core is stilled. The island is yours.</p>
      </section>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
